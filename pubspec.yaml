name: td_yar
description: A local-first manual trade journal and reflection companion.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  pdf: ^3.11.3
  path: ^1.9.1
  sqflite: ^2.4.1
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4+4

flutter:
  uses-material-design: true

# Use the runner's system SQLite for Linux tests to avoid downloading a binary
# from GitHub releases; mobile builds keep the package-provided SQLite binary.
hooks:
  user_defines:
    sqlite3:
      source:
        linux: system
        default: sqlite3
