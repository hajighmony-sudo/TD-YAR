name: CI

# One workflow for the whole repository: Rust core, Android app, Flutter modules.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: cargo test --manifest-path rust/Cargo.toml
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973"
      - name: Build Rust shared library for Android ARM64
        run: |
          cargo install cargo-ndk --locked
          cd rust
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release
      - uses: actions/upload-artifact@v6
        with:
          name: tradenex-rust-android-libs
          path: app/src/main/jniLibs
          if-no-files-found: error
          retention-days: 7

  android:
    needs: rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: tradenex-rust-android-libs
          path: app/src/main/jniLibs
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap Flutter add-to-app module
        run: bash scripts/bootstrap_flutter_module.sh
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'
          cache-provider: basic
      - name: Test and build Android app (retry transient repository failures)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle failed on attempt $attempt; retrying after a short delay..."
              sleep 15
            fi
          done
          exit 1
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: TRADIX-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: TRADIX-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

  flutter-tx-ai:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: flutter_fx
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze --no-pub --no-fatal-infos
      - run: flutter test --no-pub

  flutter-journal:
    # Root Flutter project (offline journal foundation), present on main and the Flutter branches.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Detect Flutter project
        id: detect
        run: |
          if [ -f pubspec.yaml ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      - uses: subosito/flutter-action@v2
        if: steps.detect.outputs.found == 'true'
        with:
          channel: stable
          cache: true
      - if: steps.detect.outputs.found == 'true'
        run: flutter pub get
      - if: steps.detect.outputs.found == 'true'
        run: flutter analyze --no-fatal-infos
      - name: Install system SQLite for Linux tests
        if: steps.detect.outputs.found == 'true'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Run Flutter journal tests (retry transient failures)
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if flutter test; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Flutter tests failed on attempt $attempt; retrying after a short delay..."
              sleep 15
            fi
          done
          exit 1

  mql-files:
    # Cheap sanity check for the MetaTrader bridge Expert Advisors (they are compiled inside MetaEditor, not here).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: |
          test -f metatrader/TradixBridge.mq5
          test -f metatrader/TradixBridge.mq4
          grep -q "WebRequest" metatrader/TradixBridge.mq5
          grep -q "WebRequest" metatrader/TradixBridge.mq4

  all-green:
    # Single required check for branch protection.
    if: always()
    needs: [rust, android, flutter-tx-ai, flutter-journal, mql-files]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -q '"result": "\(failure\|cancelled\)"'; then exit 1; fi

  release-apk:
    # Publishes the installable debug APK as a GitHub Release ("Latest APK") on every green push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, all-green]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: TRADIX-debug-apk
          path: apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv apk/app-debug.apk apk/TRADIX.apk
          gh release delete latest-apk --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create latest-apk apk/TRADIX.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "TRADIX APK (آخرین نسخه)" \
            --notes "نسخهٔ دیباگ قابل نصب. commit: $GITHUB_SHA"
